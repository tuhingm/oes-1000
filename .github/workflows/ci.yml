name: OES Intelligence CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and tests
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run numerical and decision-rule tests
        run: python -m pytest
